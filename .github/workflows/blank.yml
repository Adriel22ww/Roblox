name: PC Virtual RDP

on:
  workflow_dispatch:

jobs:
  pc:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:

      - name: Instalar XFCE e XRDP
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            xorgxrdp \
            dbus-x11

      - name: Configurar XFCE para XRDP
        run: |
          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_SESSION_DESKTOP=xfce
          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
          export XDG_DATA_DIRS=/usr/share/xfce4:/usr/local/share:/usr/share

          exec startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          sudo adduser xrdp ssl-cert || true

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Configurar senha RDP
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if [ -z "$RDP_PASSWORD" ]; then
            echo "ERRO: RDP_PASSWORD não foi configurado."
            exit 1
          fi

          echo "runner:$RDP_PASSWORD" | sudo chpasswd

      - name: Verificar XRDP
        run: |
          sleep 5

          echo "===== STATUS XRDP ====="
          sudo systemctl status xrdp --no-pager || true

          echo "===== PORTA 3389 ====="
          sudo ss -lntp | grep ':3389' || true

      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Verificar Tailscale
        run: |
          echo "===== TAILSCALE ====="
          tailscale status

          echo "===== IP TAILSCALE ====="
          tailscale ip -4

      - name: Testar porta RDP pelo Tailscale
        run: |
          IP=$(tailscale ip -4)

          echo "======================================"
          echo "IP TAILSCALE: $IP"
          echo "TESTANDO PORTA 3389..."
          echo "======================================"

          if timeout 5 bash -c "</dev/tcp/$IP/3389"; then
            echo "PORTA 3389 ACESSÍVEL"
          else
            echo "PORTA 3389 NÃO ACESSÍVEL"
          fi

      - name: Mostrar informações
        run: |
          echo "======================================"
          echo "PC VIRTUAL RDP"
          echo "======================================"
          echo "IP TAILSCALE:"
          tailscale ip -4
          echo "Usuário: runner"
          echo "Porta: 3389"
          echo "======================================"

      - name: Manter PC ligado
        run: |
          echo "PC virtual está pronto!"

          while true; do
            echo "PC ativo: $(date)"
            sleep 300
          done
