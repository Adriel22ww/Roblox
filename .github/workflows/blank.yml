name: PC Virtual RDP

on:
  workflow_dispatch:

jobs:
  pc:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:

      - name: Instalar XFCE e RDP
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            xorgxrdp \
            dbus-x11 \
            ufw

          sudo systemctl enable xrdp

          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_CURRENT_DESKTOP=XFCE

          exec startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          sudo adduser xrdp ssl-cert || true

          sudo ufw allow 3389/tcp || true

          sudo systemctl restart xrdp

      - name: Configurar senha RDP
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if [ -z "$RDP_PASSWORD" ]; then
            echo "ERRO: RDP_PASSWORD não existe."
            exit 1
          fi

          echo "runner:$RDP_PASSWORD" | sudo chpasswd

      - name: Verificar RDP
        run: |
          sudo systemctl restart xrdp

          sleep 5

          echo "===== XRDP ====="
          sudo systemctl status xrdp --no-pager || true

          echo "===== PORTA 3389 ====="
          sudo ss -lntp | grep ':3389' || true

      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Verificar Tailscale
        run: |
          echo "===== TAILSCALE ====="
          tailscale status

          echo "===== IP ====="
          tailscale ip -4

      - name: Mostrar informações do PC
        run: |
          echo "======================================"
          echo "PC VIRTUAL PRONTO"
          echo "======================================"
          echo "IP TAILSCALE:"
          tailscale ip -4
          echo "Usuário RDP: runner"
          echo "Porta RDP: 3389"
          echo "======================================"

      - name: Manter PC
