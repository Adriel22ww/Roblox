name: PC Virtual - Laboratório

on:
  workflow_dispatch:

jobs:
  laboratorio:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:

      - name: Instalar XFCE e XRDP
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            xorgxrdp \
            dbus-x11

      - name: Configurar sessão XFCE
        run: |
          sudo tee /etc/xrdp/startwm.sh > /dev/null <<'EOF'
          #!/bin/sh

          unset DBUS_SESSION_BUS_ADDRESS
          unset XDG_RUNTIME_DIR

          export XDG_CURRENT_DESKTOP=XFCE

          exec startxfce4
          EOF

          sudo chmod +x /etc/xrdp/startwm.sh

          sudo adduser xrdp ssl-cert || true

          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      - name: Configurar senha RDP
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if [ -z "$RDP_PASSWORD" ]; then
            echo "ERRO: o Secret RDP_PASSWORD não foi configurado."
            exit 1
          fi

          echo "runner:$RDP_PASSWORD" | sudo chpasswd

      - name: Verificar XRDP
        run: |
          sleep 5

          echo "===== STATUS XRDP ====="
          sudo systemctl status xrdp --no-pager || true

          echo "===== PORTA 3389 ====="
          sudo ss -lntp | grep ':3389' || true

      - name: Conectar ao Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Verificar Tailscale
        run: |
          echo "===== TAILSCALE ====="
          tailscale status

          echo "===== IP ====="
          tailscale ip -4

      - name: Mostrar informações
        run: |
          echo "======================================"
          echo "LABORATÓRIO RDP"
          echo "======================================"
          echo "IP TAILSCALE:"
          tailscale ip -4
          echo "Usuário: runner"
          echo "Porta: 3389"
          echo "======================================"

      - name: Manter laboratório ativo
        run: |
          echo "Laboratório iniciado."

          while true; do
            echo "Ativo: $(date)"
            sleep 300
          done
